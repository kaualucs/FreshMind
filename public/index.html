<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshchat · Visualizador de Conversa</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f6f9;
      --white:    #ffffff;
      --border:   #dde1ea;
      --primary:  #7c3aed;
      --primary-dark: #6d28d9;
      --success:  #1a8a4a;
      --warn:     #c0392b;
      --info:     #6d28d9;
      --text:     #1c2340;
      --text-mid: #4b5475;
      --muted:    #8a92a8;
      --shadow:   0 2px 8px rgba(0,0,0,.08);
      --shadow-lg: 0 4px 20px rgba(0,0,0,.1);

      /* Chat bubble colors */
      --bubble-client-bg:  #f0f2f5;
      --bubble-client-txt: #1c2340;
      --bubble-agent-bg:   #7c3aed;
      --bubble-agent-txt:  #ffffff;
      --bubble-bot-bg:     #fff8e7;
      --bubble-bot-txt:    #7a5800;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .wrap {
      width: 100%;
      max-width: 840px;
    }

    /* ── Header ── */
    header {
      margin-bottom: 32px;
    }

    .logo-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: var(--primary); border-radius: 8px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    .logo-icon svg { width: 18px; height: 18px; }

    .logo-text {
      font-family: 'Nunito', sans-serif;
      font-size: 15px; font-weight: 700;
      color: var(--text); letter-spacing: -.01em;
    }

    h1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 800; line-height: 1.2;
      color: var(--text);
    }

    h1 span { color: var(--primary); }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: .06em;
      display: flex; align-items: center; gap: 8px;
    }

    .card-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Form ── */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124,58,237,.1);
    }

    input::placeholder { color: var(--muted); }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer; border: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 700; border-radius: 8px;
      transition: all .15s;
    }

    .btn-primary {
      background: var(--primary); color: #fff;
      font-size: 14px; padding: 10px 24px;
      white-space: nowrap;
    }

    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-icon {
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--text-mid);
      font-size: 12px; padding: 7px 13px;
      display: flex; align-items: center; gap: 6px;
      font-weight: 600;
    }

    .btn-icon:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Status bar ── */
    .status-bar {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      margin-top: 14px;
    }

    .status-bar.loading { display: flex; background: #f5f3ff; border: 1px solid #ddd6fe; color: var(--info); }
    .status-bar.error   { display: flex; background: #fef2f2; border: 1px solid #fecaca; color: var(--warn); }
    .status-bar.success { display: flex; background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--success); }

    .spinner {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 2px solid rgba(109,40,217,.2);
      border-top-color: var(--info);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Conversation card ── */
    .conv-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
      box-shadow: var(--shadow);
      animation: fadeUp .3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .conv-card.visible { display: block; }

    /* ── Conv header ── */
    .conv-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between;
      gap: 12px;
      background: var(--white);
    }

    .conv-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .badge {
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      font-family: 'Nunito', sans-serif;
    }

    .badge-green  { background: #dcfce7; color: #166534; }
    .badge-blue   { background: #ede9fe; color: #5b21b6; }
    .badge-orange { background: #fff7ed; color: #c2410c; }
    .badge-muted  { background: #f1f3f6; color: var(--text-mid); }

    .conv-actions { display: flex; gap: 8px; }

    /* ── Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      border-bottom: 1px solid var(--border);
      background: #fafbfc;
    }

    .info-cell {
      padding: 12px 18px;
      border-right: 1px solid var(--border);
    }

    .info-cell:last-child { border-right: none; }

    .info-key {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 3px;
    }

    .info-val {
      font-size: 13px; color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }

    /* ── Chat window ── */
    .chat-window {
      background: #f0f2f5;
      padding: 20px 20px 24px;
      display: flex; flex-direction: column; gap: 6px;
      max-height: 600px;
      overflow-y: auto;
    }

    .chat-window::-webkit-scrollbar { width: 5px; }
    .chat-window::-webkit-scrollbar-track { background: transparent; }
    .chat-window::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    /* Cliente: esquerda */
    .msg-row.client {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* Agente: direita */
    .msg-row.agent {
      align-self: flex-end;
      align-items: flex-end;
    }

    /* Sistema/bot: centralizado */
    .msg-row.system,
    .msg-row.bot {
      align-self: center;
      align-items: center;
      max-width: 80%;
    }

    .msg-sender {
      font-size: 11px; font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 9px 14px;
      font-size: 14px; line-height: 1.55;
      word-break: break-word;
      position: relative;
    }

    /* Bolha do cliente */
    .msg-row.client .msg-bubble {
      background: var(--bubble-client-bg);
      color: var(--bubble-client-txt);
      border-radius: 0 14px 14px 14px;
      border: 1px solid #e0e3ea;
    }

    /* Bolha do agente */
    .msg-row.agent .msg-bubble {
      background: var(--bubble-agent-bg);
      color: var(--bubble-agent-txt);
      border-radius: 14px 0 14px 14px;
    }

    /* Bolha de sistema */
    .msg-row.system .msg-bubble,
    .msg-row.bot .msg-bubble {
      background: #fff8e1;
      color: #7a5800;
      border-radius: 8px;
      border: 1px solid #ffe082;
      font-size: 12px;
      text-align: center;
      padding: 7px 16px;
    }

    .msg-bubble img {
      max-width: 100%; border-radius: 8px; margin-top: 6px; display: block;
    }

    .msg-bubble a { color: inherit; text-decoration: underline; }

    .msg-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    /* Grupo de mensagens do mesmo remetente — espaçamento extra entre trocas */
    .msg-row + .msg-row { margin-top: 2px; }
    .msg-row.group-start { margin-top: 12px; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Claude analysis ── */
    .analysis-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
      box-shadow: var(--shadow);
      animation: fadeUp .3s ease both;
      margin-top: 20px;
    }

    .analysis-card.visible { display: block; }

    .analysis-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      background: #fafbfc;
    }

    .analysis-title {
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--text);
      text-transform: uppercase; letter-spacing: .06em;
      display: flex; align-items: center; gap: 8px;
    }

    .analysis-title svg { color: var(--primary); }

    .analysis-body {
      padding: 24px 28px;
      font-size: 14px; line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-claude {
      background: var(--primary);
      border: none;
      color: #fff;
      font-size: 13px; padding: 8px 18px;
      display: flex; align-items: center; gap: 7px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-claude:hover { background: var(--primary-dark); }
    .btn-claude:disabled { opacity: .5; cursor: not-allowed; }

    .btn-download {
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--text-mid);
      font-size: 12px; padding: 7px 13px;
      display: none;
      align-items: center; gap: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      transition: all .15s;
    }
    .btn-download.visible { display: flex; }
    .btn-download:hover { border-color: var(--primary); color: var(--primary); }

    .btn-notebook {
      background: var(--white);
      border: 1.5px solid #7c3aed;
      color: #7c3aed;
      font-size: 12px; padding: 7px 14px;
      display: none;
      align-items: center; gap: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-notebook.visible { display: flex; }
    .btn-notebook:hover { background: #f5f3ff; }
    .btn-notebook:disabled { opacity: .5; cursor: not-allowed; }

    .analysis-spinner {
      width: 14px; height: 14px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      padding: 11px 22px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      display: none; align-items: center; gap: 8px;
      z-index: 999; animation: fadeUp .25s ease;
      white-space: nowrap;
    }
    .toast.success { display: flex; background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--success); box-shadow: var(--shadow-lg); }
    .toast.error   { display: flex; background: #fef2f2; border: 1px solid #fecaca; color: var(--warn);    box-shadow: var(--shadow-lg); }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      font-size: 12px; color: var(--muted);
      text-align: center;
    }

    footer span { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M3 5h14M3 10h10M3 15h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">Freshchat Viewer</span>
    </div>
    <h1>Visualizador de <span>Conversa</span></h1>
    <p class="subtitle">Cole o link ou ID de um atendimento e veja todas as mensagens organizadas.</p>
  </header>

  <div class="card">
    <div class="card-title">Conversa</div>
    <div class="field">
      <label>Link ou ID da conversa</label>
      <div class="input-row">
        <input type="text" id="convInput" placeholder="https://… ou conversation_id direto"/>
        <button class="btn-primary" id="loadBtn" onclick="loadConversation()">Carregar</button>
      </div>
    </div>
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="conv-card" id="convCard">

    <div class="conv-header">
      <div class="conv-meta" id="convMeta"></div>
      <div class="conv-actions">
        <button class="btn-icon" onclick="copyTranscript()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar transcrição
        </button>
        <button class="btn-claude" id="analyzeBtn" onclick="analyzeWithClaude()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><circle cx="19" cy="5" r="3" fill="currentColor" stroke="none"/></svg>
          <div class="analysis-spinner" id="analyzeSpinner"></div>
          Analisar com Gemini
        </button>
      </div>
    </div>

    <div class="info-grid" id="infoGrid"></div>

    <div class="chat-window" id="msgList"></div>

  </div>

  <div class="analysis-card" id="analysisCard">
    <div class="analysis-header">
      <div class="analysis-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Análise Gemini
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-download" id="downloadBtn" onclick="downloadForNotebookLM()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Baixar .txt
        </button>
        <button class="btn-notebook" id="notebookBtn" onclick="importToNotebookLM()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Importar para NotebookLM
        </button>
      </div>
    </div>
    <div class="analysis-body" id="analysisBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>Powered by <span>Freshchat API</span> · <span>Claude AI</span></footer>

</div>

<script>
let transcriptText = '';
let convMetaText = '';
let analysisText = '';

// ── Helpers ──────────────────────────────────────────────────────
function setStatus(type, msg, spin = false) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar ' + type;
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('spinner').style.display = spin ? 'block' : 'none';
}

function hideStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

function extractConvId(input) {
  input = input.trim();
  let m = input.match(/\/conversation(?:s)?\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = input.match(/conversation_id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{8,}$/.test(input)) return input;
  return null;
}

function fmtDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ── Fetch (via servidor local) ────────────────────────────────────
async function fetchConversation(convId) {
  const convRes = await fetch(`/api/conversations/${convId}`);
  const conv = await convRes.json();
  if (!convRes.ok) throw new Error(conv.error || `Erro ${convRes.status}`);

  let contact = null;
  const userId = conv.user_id || conv.assigned_user_id;
  if (userId) {
    try {
      const uRes = await fetch(`/api/users/${userId}`);
      if (uRes.ok) contact = await uRes.json();
    } catch(_) {}
  }

  let msgs = [], page = 1;
  while (true) {
    const mRes = await fetch(`/api/conversations/${convId}/messages?page=${page}&items_per_page=50`);
    if (!mRes.ok) break;
    const mData = await mRes.json();
    const batch = mData.messages || [];
    msgs = msgs.concat(batch);
    if (batch.length < 50 || page >= 6) break;
    page++;
  }

  msgs.sort((a, b) => new Date(a.created_time || 0) - new Date(b.created_time || 0));

  return { conv, contact, msgs };
}

// ── Render ────────────────────────────────────────────────────────
function render({ conv, contact, msgs }) {
  const statusColor = {
    'assigned': 'badge-blue',
    'resolved': 'badge-green',
    'open':     'badge-green',
    'new':      'badge-orange',
  };
  const sc = statusColor[(conv.status || '').toLowerCase()] || 'badge-muted';

  const meta = document.getElementById('convMeta');
  meta.innerHTML = `
    ${conv.status    ? `<span class="badge ${sc}">${conv.status}</span>` : ''}
    ${conv.channel_id ? `<span class="badge badge-muted">${conv.channel_id}</span>` : ''}
    <span class="badge badge-muted">${msgs.length} msgs</span>
  `;

  const contactName = contact
    ? [contact.first_name, contact.last_name].filter(Boolean).join(' ') || contact.email || '—'
    : '—';

  const agentName = (() => {
    const agentMsg = [...msgs].reverse().find(m => m.actor_type === 'agent');
    return agentMsg?.actor_name || conv.assigned_agent_id || '—';
  })();

  const infoItems = [
    { k: 'ID',         v: conv.id || conv.conversation_id || '—' },
    { k: 'Contato',    v: contactName },
    { k: 'Agente',     v: agentName },
    { k: 'Início',     v: fmtDate(conv.created_time) },
    { k: 'Atualizado', v: fmtDate(conv.updated_time) },
    { k: 'Canal',      v: conv.channel_id || '—' },
  ];

  document.getElementById('infoGrid').innerHTML = infoItems.map(i =>
    `<div class="info-cell">
      <div class="info-key">${i.k}</div>
      <div class="info-val">${i.v}</div>
    </div>`
  ).join('');

  convMetaText = infoItems.map(i => `${i.k}: ${i.v}`).join('\n');
  analysisText = '';
  document.getElementById('analysisCard').classList.remove('visible');
  document.getElementById('analysisBody').textContent = '';
  document.getElementById('downloadBtn').classList.remove('visible');
  document.getElementById('notebookBtn').classList.remove('visible');

  // ── Messages
  const list = document.getElementById('msgList');

  if (!msgs.length) {
    list.innerHTML = `<div class="empty">Nenhuma mensagem encontrada nesta conversa.</div>`;
    transcriptText = '';
    return;
  }

  const lines = [];
  let prevType = null;

  const bubbles = msgs.map((m, idx) => {
    const type   = (m.actor_type || '').toLowerCase();
    const name   = m.actor_name || (type === 'agent' ? 'Agente' : type === 'user' ? 'Cliente' : type);
    const time   = fmtDate(m.created_time);
    const isAgent  = type === 'agent';
    const isSystem = type === 'system' || type === 'bot';

    let content = '';
    let imgHtml = '';

    (m.message_parts || []).forEach(p => {
      if (p?.text?.content)   content += p.text.content;
      if (p?.image?.url)      imgHtml += `<img src="${p.image.url}" alt="imagem"/>`;
      if (p?.file?.url)       content += `📎 <a href="${p.file.url}" target="_blank">${p.file.name || 'arquivo'}</a>`;
    });

    if (!content && !imgHtml) return '';

    const label = isAgent ? 'Agente' : isSystem ? 'Sistema' : 'Cliente';
    if (content) lines.push(`[${label} – ${time}]: ${content}`);

    const rowClass = isAgent ? 'agent' : isSystem ? 'system' : 'client';
    const isGroupStart = type !== prevType;
    prevType = type;

    const groupClass = isGroupStart ? 'group-start' : '';

    return `<div class="msg-row ${rowClass} ${groupClass}">
      ${isGroupStart ? `<div class="msg-sender">${name}</div>` : ''}
      <div class="msg-bubble">${content}${imgHtml}</div>
      <div class="msg-time">${time}</div>
    </div>`;
  }).filter(Boolean);

  list.innerHTML = bubbles.join('') || `<div class="empty">Nenhuma mensagem com conteúdo de texto.</div>`;
  transcriptText = lines.join('\n');

  list.scrollTop = list.scrollHeight;
}

// ── Main ──────────────────────────────────────────────────────────
async function loadConversation() {
  const convInput = document.getElementById('convInput').value.trim();
  if (!convInput) { setStatus('error', '⚠️ Informe o link ou ID da conversa.'); return; }

  const convId = extractConvId(convInput);
  if (!convId)  { setStatus('error', '⚠️ Não foi possível extrair o ID. Cole o link completo ou apenas o ID.'); return; }

  document.getElementById('loadBtn').disabled = true;
  document.getElementById('convCard').classList.remove('visible');

  try {
    setStatus('loading', 'Buscando conversa…', true);
    const data = await fetchConversation(convId);
    hideStatus();
    render(data);
    document.getElementById('convCard').classList.add('visible');
    setStatus('success', `✓ ${data.msgs.length} mensagens carregadas.`);
  } catch (e) {
    setStatus('error', `❌ ${e.message}`);
    console.error(e);
  } finally {
    document.getElementById('loadBtn').disabled = false;
  }
}

async function analyzeWithClaude() {
  if (!transcriptText) return;

  const btn = document.getElementById('analyzeBtn');
  const spinner = document.getElementById('analyzeSpinner');
  const card = document.getElementById('analysisCard');
  const body = document.getElementById('analysisBody');

  btn.disabled = true;
  spinner.style.display = 'block';
  body.textContent = '';
  card.classList.add('visible');
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: transcriptText }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;

        try {
          const { text, error } = JSON.parse(payload);
          if (error) { body.textContent += `\n[Erro: ${error}]`; break; }
          if (text) { body.textContent += text; analysisText += text; }
        } catch (_) {}
      }
    }
  } catch (e) {
    body.textContent = `Erro ao conectar com Claude: ${e.message}`;
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    if (analysisText) {
      document.getElementById('downloadBtn').classList.add('visible');
      document.getElementById('notebookBtn').classList.add('visible');
    }
  }
}

function showToast(type, msg, ms = 4000) {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  t.textContent = msg;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, ms);
}

function buildFileContent() {
  return [
    '=== INFORMAÇÕES DA CONVERSA ===',
    convMetaText,
    '',
    '=== ANÁLISE DO ATENDIMENTO (gerada por Claude AI) ===',
    '',
    analysisText,
    '',
    '=== TRANSCRIÇÃO COMPLETA ===',
    '',
    transcriptText,
  ].join('\n');
}

async function importToNotebookLM() {
  if (!analysisText) return;

  const btn = document.getElementById('notebookBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  const statusRes = await fetch('/api/google/status');
  const { authed } = await statusRes.json();

  if (!authed) {
    const popup = window.open('/auth/google', 'google-auth', 'width=500,height=600');
    await new Promise((resolve, reject) => {
      window.addEventListener('message', function handler(e) {
        if (e.data?.googleAuth === 'ok') { window.removeEventListener('message', handler); resolve(); }
        if (e.data?.googleAuth === 'error') { window.removeEventListener('message', handler); reject(new Error(e.data.msg)); }
      });
      const check = setInterval(() => { if (popup.closed) { clearInterval(check); reject(new Error('Autenticação cancelada')); } }, 500);
    }).catch(e => { showToast('error', `❌ ${e.message}`); btn.disabled = false; btn.innerHTML = notebookBtnHTML(); throw e; });
  }

  try {
    const res = await fetch('/api/google/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ meta: convMetaText, analysis: analysisText, transcript: transcriptText }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showToast('success', '✓ Atendimento adicionado ao Google Doc!');
  } catch (e) {
    showToast('error', `❌ ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.innerHTML = notebookBtnHTML();
  }
}

function notebookBtnHTML() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> Importar para NotebookLM`;
}

function downloadForNotebookLM() {
  if (!analysisText) return;

  const content = [
    '=== INFORMAÇÕES DA CONVERSA ===',
    convMetaText,
    '',
    '=== ANÁLISE DO ATENDIMENTO (gerada por Claude AI) ===',
    '',
    analysisText,
    '',
    '=== TRANSCRIÇÃO COMPLETA ===',
    '',
    transcriptText,
  ].join('\n');

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `atendimento-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function copyTranscript() {
  if (!transcriptText) return;
  navigator.clipboard.writeText(transcriptText).then(() => {
    const btn = document.querySelector('.btn-icon');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => {
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar transcrição`;
    }, 2000);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('convInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadConversation();
  });
});
