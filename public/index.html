<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshchat · Processador de Atendimentos 👻</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='28' fill='%238b5cf6'/%3E%3Cellipse cx='23' cy='30' rx='5.5' ry='7.5' fill='%23ff5a6a'/%3E%3Cellipse cx='41' cy='30' rx='5.5' ry='7.5' fill='%23ff5a6a'/%3E%3Cpath d='M16 44 C22 54 42 54 48 44 L44 50 L38 45 L32 50 L26 45 L20 50 Z' fill='%231a0a2e'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #2e0a4e;
      --white:    #ffffff;
      --border:   #4e2a6e;
      --primary:  #c78dc7;
      --primary-dark: #a56ba5;
      --success:  #1a8a4a;
      --warn:     #ff6b6b;
      --info:     #c78dc7;
      --text:     #f5e6f7;
      --text-mid: #d4b8dc;
      --muted:    #b89ac2;
      --shadow:   0 2px 8px rgba(0,0,0,.3);
      --shadow-lg: 0 4px 20px rgba(0,0,0,.4);
      --bubble-client-bg:  #3b1f5e;
      --bubble-client-txt: #f5e6f7;
      --bubble-agent-bg:   #c78dc7;
      --bubble-agent-txt:  #1a0a2e;
      --bubble-bot-bg:     #4e2a6e;
      --bubble-bot-txt:    #f5e6f7;
    }
    body {
      position: relative;
      background: linear-gradient(135deg, #560ea2 0%, #c78dc7 50%, #f496a6 100%);
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    body::before { width: 380px; height: 380px; background: rgba(255,107,107,.28); top: -140px; left: -120px; }
    body::after { width: 440px; height: 440px; background: rgba(86,14,162,.4); bottom: -180px; right: -160px; }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 840px; }
    header { margin-bottom: 32px; }
    h1 { font-family: 'Nunito', sans-serif; font-size: clamp(22px, 4vw, 30px); font-weight: 800; line-height: 1.2; color: var(--text); }
    h1 span { color: var(--primary); }
    .subtitle { margin-top: 6px; font-size: 14px; color: var(--text-mid); line-height: 1.6; }
    .card { background: rgba(46, 10, 78, 0.75); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 24px 28px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .card-title { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-mid); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
    input[type="text"] { width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.25); border-radius: 8px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
    input::placeholder { color: rgba(255,255,255,0.5); }
    input:focus { border-color: #c78dc7; box-shadow: 0 0 0 3px rgba(199,141,199,0.25); }
    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    button { cursor: pointer; border: none; font-family: 'Nunito', sans-serif; font-weight: 700; border-radius: 8px; transition: all .15s; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: linear-gradient(135deg, #8b5cf6, #c78dc7);
      color: #fff; font-size: 14px; padding: 12px 24px; white-space: nowrap;
      border-radius: 999px; box-shadow: 0 4px 14px rgba(139,92,246,.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,107,.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary.btn-pink { background: linear-gradient(135deg, #fb7185, #f496a6); box-shadow: 0 4px 14px rgba(251,113,133,.4); }
    .status-bar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 14px; }
    .status-bar.loading { display: flex; background: #f5f3ff; border: 1px solid #ddd6fe; color: var(--info); }
    .status-bar.error { display: flex; background: #fef2f2; border: 1px solid #fecaca; color: var(--warn); }
    .status-bar.success { display: flex; background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--success); }
    .spinner {
      width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;
      background: linear-gradient(to bottom, #ff6b6b 0% 48%, #1a0a2e 48% 52%, #fff 52% 100%);
      border: 2px solid #1a0a2e;
      position: relative;
      animation: spin .8s linear infinite;
    }
    .spinner::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
      background: #fff; border: 1.5px solid #1a0a2e; border-radius: 50%; transform: translate(-50%, -50%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes ghost-float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-22px) rotate(3deg); }
    }
    .ghost-deco { position: fixed; pointer-events: none; z-index: 0; opacity: .35; animation: ghost-float 6s ease-in-out infinite; }
    .ghost-deco circle { fill: #2e0a4e; opacity: .6; }
    .ghost-deco path { fill: currentColor; }
    .ghost-deco--1 { width: 64px; top: 8%; right: 6%; color: #c78dc7; animation-duration: 7s; }
    .ghost-deco--2 { width: 46px; bottom: 16%; left: 4%; color: #f496a6; animation-duration: 5.5s; animation-delay: 1s; }
    .ghost-deco--3 { width: 38px; top: 42%; left: -2%; color: #ff6b6b; animation-duration: 6.5s; animation-delay: 2s; }
    .ghost-deco--4 { width: 56px; bottom: 8%; right: 10%; color: #8b5cf6; animation-duration: 8s; animation-delay: .5s; }
    @media (max-width: 640px) { .ghost-deco { display: none; } }
    .gengar-corner {
      position: fixed; bottom: 16px; right: 16px; width: 150px; z-index: 0;
      pointer-events: none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }
    @media (max-width: 640px) { .gengar-corner { width: 86px; bottom: 10px; right: 10px; } }

    /* 🔽 ADICIONADO AQUI: Corrige cores das opções do select */
    select {
      color: #fff !important;
      background-color: rgba(46, 10, 78, 0.9) !important;
    }
    select option {
      color: #fff !important;
      background-color: #2e0a4e !important;
    }
  </style>
</head>
<body>
<div class="wrap">

<svg class="ghost-deco ghost-deco--1" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C46 4 56 16 56 30v26c0 0-5-7-11 0-6 7-11-7-17 0-6 7-11 0-11 0V30C8 16 18 4 32 4z"/><circle cx="24" cy="27" r="4"/><circle cx="40" cy="27" r="4"/></svg>
<svg class="ghost-deco ghost-deco--2" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C46 4 56 16 56 30v26c0 0-5-7-11 0-6 7-11-7-17 0-6 7-11 0-11 0V30C8 16 18 4 32 4z"/><circle cx="24" cy="27" r="4"/><circle cx="40" cy="27" r="4"/></svg>
<svg class="ghost-deco ghost-deco--3" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C46 4 56 16 56 30v26c0 0-5-7-11 0-6 7-11-7-17 0-6 7-11 0-11 0V30C8 16 18 4 32 4z"/><circle cx="24" cy="27" r="4"/><circle cx="40" cy="27" r="4"/></svg>
<svg class="ghost-deco ghost-deco--4" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4C46 4 56 16 56 30v26c0 0-5-7-11 0-6 7-11-7-17 0-6 7-11 0-11 0V30C8 16 18 4 32 4z"/><circle cx="24" cy="27" r="4"/><circle cx="40" cy="27" r="4"/></svg>

<img class="gengar-corner" src="/Gengar Gif.gif" alt="" aria-hidden="true">

  <header>
    <h1>Processador de <span>Atendimentos</span></h1>
    <p class="subtitle">Cole o(s) link(s) ou ID(s) de atendimento, veja um resumo rápido e processe para o Google Docs.</p>
  </header>

  <div class="card">
    <div class="card-title">Atendimentos</div>
    <div class="field">
      <label>Link(s) da conversa (um por linha)</label>
      <textarea id="convInput" placeholder="https://…&#10;https://…&#10;https://…" rows="3" style="width:100%; padding:10px; border-radius:8px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.25); color:#fff; font-family:'Inter',sans-serif; font-size:14px; resize:vertical;"></textarea>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="apiKeySelect" style="color: var(--text-mid); font-size: 13px; font-weight: 600;">API Gemini:</label>
          <select id="apiKeySelect" style="padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.25); color: #fff; font-family: 'Inter', sans-serif; font-size: 13px;">
            <option value="1">Conta 1</option>
            <option value="2">Conta 2</option>
            <option value="3">Conta 3</option>
            <option value="4">Conta 4</option>
            <option value="5">Conta 5</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="docThemeSelect" style="color: var(--text-mid); font-size: 13px; font-weight: 600;">Documento:</label>
          <select id="docThemeSelect" style="padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.25); color: #fff; font-family: 'Inter', sans-serif; font-size: 13px;">
            <option value="NFP">NFP</option>
            <option value="NF">NF</option>
            <option value="GONUTRI">GONUTRI</option>
            <option value="IA">IA</option>
            <option value="RELATORIOS">RELATÓRIOS</option>
            <option value="CRM">CRM</option>
            <option value="PASS">PASS</option>
            <option value="WOD">WOD</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-primary" id="previewBatchBtn" onclick="previewBatch()" style="flex:1;">
          <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M32 4C46 4 56 16 56 30v26c0 0-5-7-11 0-6 7-11-7-17 0-6 7-11 0-11 0V30C8 16 18 4 32 4z"/><circle cx="24" cy="27" r="4" fill="#2e0a4e"/><circle cx="40" cy="27" r="4" fill="#2e0a4e"/></svg>
          Pré-visualizar
        </button>
        <button class="btn-primary btn-pink" id="processBatchBtn" onclick="processBatch()" style="flex:1;">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#fff"/><path d="M4 32a28 28 0 0 1 56 0z" fill="#ff5a6a"/><rect x="4" y="29" width="56" height="6" fill="#1a0a2e"/><circle cx="32" cy="32" r="8" fill="#fff" stroke="#1a0a2e" stroke-width="4"/></svg>
          Processar Todas
        </button>
      </div>
    </div>
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <div class="card-title">👻 Pré-visualização dos Atendimentos</div>
    <div id="previewList"></div>
  </div>
</div>

<script>
function setStatus(type, msg, spin = false) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar ' + type;
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('spinner').style.display = spin ? 'block' : 'none';
}

function extractConvId(input) {
  input = input.trim();
  let m = input.match(/\/conversation(?:s)?\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = input.match(/conversation_id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{8,}$/.test(input)) return input;
  return null;
}

async function previewBatch() {
  const textarea = document.getElementById('convInput');
  const links = textarea.value.trim().split('\n').filter(link => link.trim() !== '');
  if (links.length === 0) { setStatus('error', '⚠️ Cole pelo menos um link.'); return; }
  const btn = document.getElementById('previewBatchBtn');
  btn.disabled = true;
  btn.textContent = 'Gerando pré-visualizações...';
  const selectedApi = document.getElementById('apiKeySelect').value;
  const previewCard = document.getElementById('previewCard');
  const previewList = document.getElementById('previewList');
  previewList.innerHTML = '';
  previewCard.style.display = 'block';
  setStatus('loading', `👁️ Gerando resumos de ${links.length} conversa(s)...`, true);
  for (let i = 0; i < links.length; i++) {
    const convId = extractConvId(links[i]);
    if (!convId) {
      previewList.innerHTML += `<div class="field" style="border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px;"><strong>${i + 1}.</strong> ❌ Link inválido: "${links[i]}"</div>`;
      continue;
    }
    setStatus('loading', `🔄 Resumindo conversa ${i + 1} de ${links.length}...`, true);
    try {
      const res = await fetch('/api/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ convId, apiKeyIndex: selectedApi })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      previewList.innerHTML += `
        <div class="field" style="border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px;">
          <div style="font-weight:700; color:#fff; margin-bottom:4px;">${i + 1}. ${data.contactName} <span style="color:var(--muted); font-weight:400; font-size:12px;">(${data.msgCount} msgs)</span></div>
          <div style="font-size:13px; color:var(--text-mid); margin-bottom:4px;">${data.resumo}</div>
          <a href="${data.convLink}" target="_blank" style="font-size:12px; color:var(--primary);">Abrir atendimento</a>
        </div>`;
    } catch (e) {
      previewList.innerHTML += `<div class="field" style="border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:12px;"><strong>${i + 1}.</strong> ❌ ${e.message}</div>`;
    }
  }
  setStatus('success', `✓ Pré-visualização concluída.`);
  btn.disabled = false;
  btn.textContent = '👁️ Pré-visualizar';
}

async function processBatch() {
  const textarea = document.getElementById('convInput');
  const links = textarea.value.trim().split('\n').filter(link => link.trim() !== '');
  if (links.length === 0) { setStatus('error', '⚠️ Cole pelo menos um link.'); return; }
  const btn = document.getElementById('processBatchBtn');
  btn.disabled = true;
  btn.textContent = 'Processando...';
  setStatus('loading', `⚙️ Iniciando processamento de ${links.length} conversa(s)...`, true);
  const selectedApi = document.getElementById('apiKeySelect').value;
  const selectedDoc = document.getElementById('docThemeSelect').value;
  for (let i = 0; i < links.length; i++) {
    const convId = extractConvId(links[i]);
    if (!convId) {
      setStatus('error', `❌ Link inválido na linha ${i + 1}: "${links[i]}". Processamento interrompido.`);
      btn.disabled = false;
      btn.textContent = '⚡ Processar Todas';
      return;
    }
    setStatus('loading', `🔄 Processando conversa ${i + 1} de ${links.length}...`, true);
    const res = await fetch('/api/batch-process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        convId: convId,
        apiKeyIndex: selectedApi,
        docTheme: selectedDoc
      })
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus('error', `❌ Erro na conversa ${i + 1}: ${err.error}`);
      btn.disabled = false;
      btn.textContent = '⚡ Processar Todas';
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 1500));
  }
  setStatus('success', `✅ Processamento concluído! ${links.length} conversa(s) adicionada(s) ao Google Docs.`);
  btn.disabled = false;
  btn.textContent = '⚡ Processar Todas';
}
</script>
</body>
</html>
