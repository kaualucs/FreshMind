<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshchat · Visualizador de Conversa</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0c10;
      --surface: #111318;
      --border:  #1e2230;
      --accent:  #00e5a0;
      --accent2: #0090ff;
      --warn:    #ff6b35;
      --text:    #e8eaf0;
      --muted:   #5a6076;
      --card:    #13161f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .3;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(0,229,160,.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
    }

    /* ── Header ── */
    header { margin-bottom: 40px; }

    .logo-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: var(--accent); border-radius: 8px;
      display: grid; place-items: center;
    }

    .logo-icon svg { width: 18px; height: 18px; }

    .logo-text {
      font-size: 12px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      margin-top: 8px; font-size: 14px;
      color: var(--muted); font-weight: 400; line-height: 1.5;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .45;
    }

    .card-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }

    .card-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Form ── */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 11px 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,.07);
    }

    input::placeholder { color: var(--muted); }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer; border: none;
      font-family: 'Syne', sans-serif;
      font-weight: 700; border-radius: 10px;
      transition: all .18s;
    }

    .btn-primary {
      background: var(--accent); color: #000;
      font-size: 14px; padding: 11px 28px;
      letter-spacing: .03em;
      white-space: nowrap;
      position: relative; overflow: hidden;
    }

    .btn-primary::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0); transition: background .15s;
    }

    .btn-primary:hover::after { background: rgba(255,255,255,.12); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px; padding: 7px 13px;
      display: flex; align-items: center; gap: 6px;
      letter-spacing: .04em;
    }

    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Status bar ── */
    .status-bar {
      display: none;
      align-items: center; gap: 10px;
      padding: 11px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      margin-top: 16px;
    }

    .status-bar.loading { display: flex; background: rgba(0,144,255,.07); border: 1px solid rgba(0,144,255,.2); color: var(--accent2); }
    .status-bar.error   { display: flex; background: rgba(255,107,53,.07); border: 1px solid rgba(255,107,53,.2); color: var(--warn); }
    .status-bar.success { display: flex; background: rgba(0,229,160,.07); border: 1px solid rgba(0,229,160,.2); color: var(--accent); }

    .spinner {
      width: 15px; height: 15px; flex-shrink: 0;
      border: 2px solid rgba(0,144,255,.25);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Conversation card ── */
    .conv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: none;
      animation: fadeUp .35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .conv-card.visible { display: block; }

    /* ── Conv header ── */
    .conv-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between;
      gap: 12px;
    }

    .conv-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .badge {
      font-size: 11px; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 6px;
    }

    .badge-green  { background: rgba(0,229,160,.1);  color: var(--accent);  border: 1px solid rgba(0,229,160,.2); }
    .badge-blue   { background: rgba(0,144,255,.1);  color: var(--accent2); border: 1px solid rgba(0,144,255,.2); }
    .badge-orange { background: rgba(255,107,53,.1); color: var(--warn);    border: 1px solid rgba(255,107,53,.2); }
    .badge-muted  { background: rgba(90,96,118,.1);  color: var(--muted);   border: 1px solid rgba(90,96,118,.2); }

    .conv-actions { display: flex; gap: 8px; }

    /* ── Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .info-cell {
      background: var(--card);
      padding: 14px 20px;
    }

    .info-key {
      font-size: 10px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 5px;
    }

    .info-val {
      font-size: 13px; color: var(--text);
      font-family: 'DM Mono', monospace;
      word-break: break-all;
    }

    /* ── Message list ── */
    .msg-list {
      padding: 24px 28px;
      display: flex; flex-direction: column; gap: 14px;
      max-height: 600px;
      overflow-y: auto;
    }

    .msg-list::-webkit-scrollbar { width: 4px; }
    .msg-list::-webkit-scrollbar-track { background: transparent; }
    .msg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex; gap: 12px; align-items: flex-start;
    }

    .msg-row.agent { flex-direction: row-reverse; }

    .avatar {
      flex-shrink: 0;
      width: 32px; height: 32px;
      border-radius: 9px;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700;
      letter-spacing: .04em;
    }

    .avatar.client { background: rgba(0,144,255,.15); color: var(--accent2); border: 1px solid rgba(0,144,255,.2); }
    .avatar.agent  { background: rgba(0,229,160,.12); color: var(--accent);  border: 1px solid rgba(0,229,160,.18); }
    .avatar.system { background: rgba(90,96,118,.12); color: var(--muted);   border: 1px solid rgba(90,96,118,.2); }
    .avatar.bot    { background: rgba(255,107,53,.1); color: var(--warn);    border: 1px solid rgba(255,107,53,.2); }

    .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.agent .msg-body { align-items: flex-end; }

    .msg-name {
      font-size: 10px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted);
    }

    .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px; line-height: 1.6;
      color: var(--text);
      word-break: break-word;
    }

    .msg-row.agent .msg-bubble {
      background: rgba(0,229,160,.05);
      border-color: rgba(0,229,160,.14);
    }

    .msg-bubble img {
      max-width: 100%; border-radius: 8px; margin-top: 6px; display: block;
    }

    .msg-time {
      font-size: 10px; color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    /* system / bot messages */
    .msg-row.system, .msg-row.bot {
      justify-content: center;
    }

    .msg-row.system .msg-bubble,
    .msg-row.bot .msg-bubble {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      max-width: 90%;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      font-size: 12px; color: var(--muted);
      text-align: center; letter-spacing: .04em;
    }

    footer span { color: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M3 5h14M3 10h10M3 15h7" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">Freshchat Viewer</span>
    </div>
    <h1>Visualizador de<br/><span>Conversa</span></h1>
    <p class="subtitle">Cole o link ou ID de um atendimento e veja todas as mensagens organizadas.</p>
  </header>

  <div class="card">
    <div class="card-title">Configuração</div>
    <div class="field">
      <label>API Token do Freshchat</label>
      <input type="password" id="fcToken" placeholder="Bearer xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"/>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Conversa</div>
    <div class="field">
      <label>Link ou ID da conversa</label>
      <div class="input-row">
        <input type="text" id="convInput" placeholder="https://… ou conversation_id direto"/>
        <button class="btn-primary" id="loadBtn" onclick="loadConversation()">Carregar</button>
      </div>
    </div>
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="conv-card" id="convCard">

    <div class="conv-header">
      <div class="conv-meta" id="convMeta"></div>
      <div class="conv-actions">
        <button class="btn-icon" onclick="copyTranscript()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar transcrição
        </button>
      </div>
    </div>

    <div class="info-grid" id="infoGrid"></div>

    <div class="msg-list" id="msgList"></div>

  </div>

  <footer>Powered by <span>Freshchat API</span></footer>

</div>

<script>
let transcriptText = '';

// ── Helpers ──────────────────────────────────────────────────────
function setStatus(type, msg, spin = false) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar ' + type;
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('spinner').style.display = spin ? 'block' : 'none';
}

function hideStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

function extractConvId(input) {
  input = input.trim();
  let m = input.match(/conversation(?:s)?\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = input.match(/conversation_id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{8,}$/.test(input)) return input;
  return null;
}

function fmtDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ── Fetch ─────────────────────────────────────────────────────────
async function fetchConversation(convId, token) {
  const base = 'https://api.freshchat.com/v2';
  const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

  const convRes = await fetch(`${base}/conversations/${convId}`, { headers });
  if (!convRes.ok) throw new Error(`Freshchat ${convRes.status}: ${convRes.statusText}`);
  const conv = await convRes.json();

  // Fetch user info (contact)
  let contact = null;
  const userId = conv.user_id || conv.assigned_user_id;
  if (userId) {
    try {
      const uRes = await fetch(`${base}/users/${userId}`, { headers });
      if (uRes.ok) contact = await uRes.json();
    } catch(_) {}
  }

  // Fetch messages (paginated)
  let msgs = [], page = 1;
  while (true) {
    const mRes = await fetch(`${base}/conversations/${convId}/messages?page=${page}&items_per_page=50`, { headers });
    if (!mRes.ok) break;
    const mData = await mRes.json();
    const batch = mData.messages || [];
    msgs = msgs.concat(batch);
    if (batch.length < 50 || page >= 6) break;
    page++;
  }

  // Sort ascending
  msgs.sort((a, b) => new Date(a.created_time || 0) - new Date(b.created_time || 0));

  return { conv, contact, msgs };
}

// ── Render ────────────────────────────────────────────────────────
function render({ conv, contact, msgs }) {
  // ── Meta badges
  const statusColor = {
    'assigned': 'badge-blue',
    'resolved': 'badge-green',
    'open':     'badge-green',
    'new':      'badge-orange',
  };
  const sc = statusColor[(conv.status || '').toLowerCase()] || 'badge-muted';

  const meta = document.getElementById('convMeta');
  meta.innerHTML = `
    ${conv.status    ? `<span class="badge ${sc}">${conv.status}</span>` : ''}
    ${conv.channel_id ? `<span class="badge badge-muted">${conv.channel_id}</span>` : ''}
    <span class="badge badge-muted">${msgs.length} msgs</span>
  `;

  // ── Info grid
  const contactName = contact
    ? [contact.first_name, contact.last_name].filter(Boolean).join(' ') || contact.email || '—'
    : '—';

  const agentName = (() => {
    const agentMsg = [...msgs].reverse().find(m => m.actor_type === 'agent');
    return agentMsg?.actor_name || conv.assigned_agent_id || '—';
  })();

  const infoItems = [
    { k: 'ID',         v: conv.id || conv.conversation_id || '—' },
    { k: 'Contato',    v: contactName },
    { k: 'Agente',     v: agentName },
    { k: 'Início',     v: fmtDate(conv.created_time) },
    { k: 'Atualizado', v: fmtDate(conv.updated_time) },
    { k: 'Canal',      v: conv.channel_id || '—' },
  ].filter(i => i.v && i.v !== '—' || true);

  document.getElementById('infoGrid').innerHTML = infoItems.map(i =>
    `<div class="info-cell">
      <div class="info-key">${i.k}</div>
      <div class="info-val">${i.v}</div>
    </div>`
  ).join('');

  // ── Messages
  const list = document.getElementById('msgList');

  if (!msgs.length) {
    list.innerHTML = `<div class="empty">Nenhuma mensagem encontrada nesta conversa.</div>`;
    transcriptText = '';
    return;
  }

  const lines = [];
  const bubbles = msgs.map(m => {
    const type   = (m.actor_type || '').toLowerCase(); // agent | user | system | bot
    const name   = m.actor_name || (type === 'agent' ? 'Agente' : type === 'user' ? 'Cliente' : type);
    const time   = fmtDate(m.created_time);
    const isAgent = type === 'agent';
    const isSystem = type === 'system' || type === 'bot';

    // Extract message content
    let content = '';
    let imgHtml = '';

    (m.message_parts || []).forEach(p => {
      if (p?.text?.content)   content += p.text.content;
      if (p?.image?.url)      imgHtml += `<img src="${p.image.url}" alt="imagem"/>`;
      if (p?.file?.url)       content += `📎 <a href="${p.file.url}" target="_blank" style="color:var(--accent2);">${p.file.name || 'arquivo'}</a>`;
    });

    if (!content && !imgHtml) return '';

    // Plain text for copy
    const label = isAgent ? 'Agente' : isSystem ? 'Sistema' : 'Cliente';
    if (content) lines.push(`[${label} – ${time}]: ${content}`);

    const avatarClass = isAgent ? 'agent' : isSystem ? 'system' : 'client';
    const avatarText  = isAgent ? 'AG' : isSystem ? 'SYS' : 'CL';
    const rowClass    = isAgent ? 'agent' : isSystem ? 'system' : '';

    return `<div class="msg-row ${rowClass}">
      <div class="avatar ${avatarClass}">${avatarText}</div>
      <div class="msg-body">
        <div class="msg-name">${name}</div>
        <div class="msg-bubble">${content}${imgHtml}</div>
        <div class="msg-time">${time}</div>
      </div>
    </div>`;
  }).filter(Boolean);

  list.innerHTML = bubbles.join('') || `<div class="empty">Nenhuma mensagem com conteúdo de texto.</div>`;
  transcriptText = lines.join('\n');

  // Scroll to bottom
  list.scrollTop = list.scrollHeight;
}

// ── Main ──────────────────────────────────────────────────────────
async function loadConversation() {
  const token     = document.getElementById('fcToken').value.trim();
  const convInput = document.getElementById('convInput').value.trim();

  if (!token)     { setStatus('error', '⚠️ Informe o API Token do Freshchat.'); return; }
  if (!convInput) { setStatus('error', '⚠️ Informe o link ou ID da conversa.'); return; }

  const convId = extractConvId(convInput);
  if (!convId)  { setStatus('error', '⚠️ Não foi possível extrair o ID. Cole o link completo ou apenas o ID.'); return; }

  document.getElementById('loadBtn').disabled = true;
  document.getElementById('convCard').classList.remove('visible');

  try {
    setStatus('loading', 'Buscando conversa…', true);
    const data = await fetchConversation(convId, token);
    hideStatus();
    render(data);
    document.getElementById('convCard').classList.add('visible');
    setStatus('success', `✓ ${data.msgs.length} mensagens carregadas.`);
  } catch (e) {
    setStatus('error', `❌ ${e.message}`);
    console.error(e);
  } finally {
    document.getElementById('loadBtn').disabled = false;
  }
}

function copyTranscript() {
  if (!transcriptText) return;
  navigator.clipboard.writeText(transcriptText).then(() => {
    const btn = document.querySelector('.btn-icon');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => {
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar transcrição`;
    }, 2000);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('convInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadConversation();
  });
});
</script>
</body>
</html>
